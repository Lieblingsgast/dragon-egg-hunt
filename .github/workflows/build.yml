name: Build

# Builds the mod on every push and pull request.
# Publishing a GitHub release (tag like v1.0.0, matching mod_version in gradle.properties)
# builds it again and attaches the mod jar and the resource pack to the release.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check that the release tag matches mod_version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "v$version" != "$TAG" ]; then
            echo "Release tag $TAG does not match mod_version=$version in gradle.properties" >&2
            exit 1
          fi

      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: dragon-egg-hunt
          path: |
            build/libs/*.jar
            src/main/resources/pack/dragonegghunt-pack.zip

      - name: Attach files to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            build/libs/dragon-egg-hunt-*.jar
            src/main/resources/pack/dragonegghunt-pack.zip
          fail_on_unmatched_files: true
