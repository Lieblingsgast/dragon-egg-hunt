name: Build

# Builds the mod on every push and pull request.
# Pushing a tag like v1.0.0 also creates a GitHub release with the mod jar and the resource pack.
# The tag must match mod_version in gradle.properties.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Check that the tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$version in gradle.properties" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dragon-egg-hunt
          path: |
            build/libs/*.jar
            src/main/resources/pack/dragonegghunt-pack.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/dragon-egg-hunt-*.jar
            src/main/resources/pack/dragonegghunt-pack.zip
          fail_on_unmatched_files: true
